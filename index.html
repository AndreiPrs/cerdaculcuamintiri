<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cerdacul cu Amintiri - O casă tradițională bucovineană pentru cazare și vacanță.">
  <meta name="theme-color" content="#263238">
  <title>Cerdacul cu Amintiri</title>
  <link rel="stylesheet" href="assets/style.css">

  <style>
    h1, h2, p, nav a {
      font-family: 'Arhaic Romanesc', serif !important;
    }
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: rgba(38,50,56,0.95);
      min-width: 160px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      padding: 12px 16px;
      z-index: 1;
      top: 100%;
      left: 0;
      border-radius: 8px;
    }
    .dropdown-content a {
      color: white;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      border-radius: 4px;
    }
    .dropdown-content a:hover {
      background-color: rgba(55,71,79,0.8);
    }
  </style>
</head>
<body style="margin:0; padding:0; overflow:hidden; height:100vh;">
  <header style="position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:10; background:rgba(38,50,56,0.85); border-radius:32px; box-shadow:0 4px 24px rgba(0,0,0,0.12); padding:0.5em 2em;">
    <nav>
